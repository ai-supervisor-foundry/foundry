name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-
      
      - name: Cache TypeScript build
        uses: actions/cache@v5
        with:
          path: |
            dist
            **/*.tsbuildinfo
          key: ${{ runner.os }}-tsc-${{ matrix.node-version }}-${{ hashFiles('src/**/*.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-tsc-${{ matrix.node-version }}-
            ${{ runner.os }}-tsc-
      
      - name: Install dependencies
        run: npm ci
      
      - name: TypeScript compilation
        run: npm run build
      
      - name: Upload coverage to Codecov (Node 20.x only)
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  unit-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [lts/*]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-
      
      - name: Cache TypeScript build
        uses: actions/cache@v5
        with:
          path: |
            dist
            **/*.tsbuildinfo
          key: ${{ runner.os }}-tsc-${{ matrix.node-version }}-${{ hashFiles('src/**/*.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-tsc-${{ matrix.node-version }}-
            ${{ runner.os }}-tsc-
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Unit Tests
        run: npm run test:unit
      
  functional-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [lts/*]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-
      
      - name: Cache TypeScript build
        uses: actions/cache@v5
        with:
          path: |
            dist
            **/*.tsbuildinfo
          key: ${{ runner.os }}-tsc-${{ matrix.node-version }}-${{ hashFiles('src/**/*.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-tsc-${{ matrix.node-version }}-
            ${{ runner.os }}-tsc-

      - name: Install dependencies
        run: npm ci

      - name: Run Functional Tests
        run: npm run test:functional

  version-bump:
    runs-on: ubuntu-latest
    needs: [build, unit-tests, functional-tests]
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[version-bump]')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Determine bump type from PR title
        id: bump-type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_TITLE=""
          COMMIT_SHA="${{ github.sha }}"
          PR_JSON=$(gh pr list --repo "${{ github.repository }}" --state merged --search "$COMMIT_SHA" --json title --limit 1 2>/dev/null || echo "[]")
          PR_TITLE=$(echo "$PR_JSON" | node -p "try{JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'))[0]?.title||''}catch{''}" 2>/dev/null || echo "")
          if [ -z "$PR_TITLE" ]; then
            PR_TITLE="${{ github.event.head_commit.message }}"
          fi
          echo "PR/commit title: $PR_TITLE"
          TITLE_UPPER=$(echo "$PR_TITLE" | tr '[:lower:]' '[:upper:]')
          if echo "$TITLE_UPPER" | grep -qE '^MAJOR[^A-Z]'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$TITLE_UPPER" | grep -qE '^MINOR[^A-Z]'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        run: |
          echo "Bump type: ${{ steps.bump-type.outputs.type }}"
          bash scripts/bump-version.sh "${{ steps.bump-type.outputs.type }}"

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json UI/backend/package.json UI/frontend/package.json
          git commit -m "chore: bump version to ${NEW_VERSION} [version-bump]"
          git push