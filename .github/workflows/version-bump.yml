name: Version Bump

on:
  push:
    branches:
      - main

jobs:
  bump:
    runs-on: ubuntu-latest
    # Skip if the push was made by this workflow (prevent infinite loop)
    if: "!contains(github.event.head_commit.message, '[version-bump]')"

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Determine bump type from PR title
        id: bump-type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the PR associated with this merge commit
          PR_TITLE=""
          COMMIT_SHA="${{ github.sha }}"

          # Try to get PR title via gh CLI
          PR_JSON=$(gh pr list --state merged --search "$COMMIT_SHA" --json title --limit 1 2>/dev/null || echo "[]")
          PR_TITLE=$(echo "$PR_JSON" | node -p "try{JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'))[0]?.title||''}catch{''}" 2>/dev/null || echo "")

          # Fallback: check the commit message itself
          if [ -z "$PR_TITLE" ]; then
            PR_TITLE="${{ github.event.head_commit.message }}"
          fi

          echo "PR/commit title: $PR_TITLE"

          # Case-insensitive prefix check
          TITLE_UPPER=$(echo "$PR_TITLE" | tr '[:lower:]' '[:upper:]')
          if echo "$TITLE_UPPER" | grep -qE '^MAJOR[^A-Z]'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$TITLE_UPPER" | grep -qE '^MINOR[^A-Z]'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        run: |
          echo "Bump type: ${{ steps.bump-type.outputs.type }}"
          bash scripts/bump-version.sh "${{ steps.bump-type.outputs.type }}"

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json UI/backend/package.json UI/frontend/package.json
          git commit -m "chore: bump version to ${NEW_VERSION} [version-bump]"
          git push
