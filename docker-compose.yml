services:
  dragonflydb:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: dragonflydb
    ports:
      - "6499:6379"
    volumes:
      - dragonfly-data:/data
    environment:
      - DRAGONFLY_LOG_LEVEL=info
    command: >
      --logtostderr
      --alsologtostderr
    restart: unless-stopped
    networks:
      - supervisor-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./sandbox:/sandbox
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull phi4-mini || true && wait"]
    restart: unless-stopped
    networks:
      - supervisor-network

  postgres:
    image: postgres:14-alpine
    container_name: supervisor-postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=supervisor
      - POSTGRES_PASSWORD=supervisor
      - POSTGRES_DB=supervisor
    restart: unless-stopped
    networks:
      - supervisor-network

volumes:
  dragonfly-data:
    driver: local
  ollama_data:
    driver: local
  postgres-data:
    driver: local

networks:
  supervisor-network:
    driver: bridge
